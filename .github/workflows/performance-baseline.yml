name: Manual Performance Baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  performance-baseline:
    name: Run bounded local baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            app/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/backend/requirements.txt -r requirements-test.txt

      - name: Run the approved loopback-only baseline
        run: python scripts/run_performance_baseline.py

      - name: Save performance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-baseline-${{ github.run_number }}
          path: |
            reports/performance
            performance/baseline-results.json
            performance/PERFORMANCE_RESULTS.md
          if-no-files-found: warn
          retention-days: 14
