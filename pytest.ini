[pytest]
testpaths = tests
addopts = -ra --strict-markers --html=reports/pytest-report.html --self-contained-html --junitxml=reports/junit.xml
markers =
    functional: User-visible behavior checks against approved requirements.
    negative: Invalid-input and denied-workflow checks.
    regression: Stable checks rerun to detect unintended behavior changes.
    smoke: Critical checks that determine whether broader testing can begin.
    ui: Browser-based user-interface tests.
